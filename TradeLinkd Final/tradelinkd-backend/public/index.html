<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>TradeLinkd — Find Trusted Contractors for Your Property</title>
<style>
  :root{
    --bg:#f6f5f1; --card:#ffffff; --ink:#1c1c1a; --sub:#6b6a66;
    --line:#e6e4de; --accent:#1d5f45; --accent-dark:#123f2e; --accent-light:#e5f0ea;
    --warn:#b3541e; --radius:14px; --star:#c8871a;
    --shadow:0 1px 2px rgba(20,40,30,0.05), 0 2px 10px rgba(20,40,30,0.05);
  }
  *{box-sizing:border-box;}
  body{
    margin:0;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Helvetica,Arial,sans-serif;color:var(--ink);
    background-color:#ffffff;
    min-height:100vh;
  }
  header{background:linear-gradient(135deg, var(--accent-dark), #0e2e22);color:#fff;padding:20px 24px;display:flex;align-items:center;justify-content:space-between;flex-wrap:wrap;gap:10px;box-shadow:0 3px 20px rgba(0,0,0,0.2);position:relative;}
  header::after{content:'';position:absolute;left:0;right:0;bottom:0;height:3px;background:#FFC42E;}
  header .brand{font-size:21px;font-weight:700;letter-spacing:-0.3px;cursor:pointer;}
  header .brand span{color:#a7d8c1;}
  .brand-mark{font-weight:700;color:var(--accent-dark);}
  .brand-mark span{color:var(--accent);}
  nav{display:flex;flex-wrap:wrap;gap:8px;align-items:center;}
  nav button{background:transparent;border:1px solid rgba(255,255,255,0.32);color:#fff;padding:8px 16px;border-radius:999px;font-size:13.5px;font-weight:600;cursor:pointer;position:relative;transition:background 0.15s ease, border-color 0.15s ease, transform 0.1s ease;}
  nav button:hover{background:rgba(255,255,255,0.14);}
  nav button:active{transform:scale(0.97);}
  nav button.active{background:#fff;color:var(--accent-dark);border-color:#fff;}
  nav .who{font-size:13px;color:#cfe8db;margin-right:4px;display:flex;align-items:center;gap:6px;}
  nav .who img{width:22px;height:22px;border-radius:50%;object-fit:cover;}
  main{max-width:900px;margin:0 auto;padding:24px 20px 60px;position:relative;}
  footer{text-align:center;color:var(--sub);font-size:12px;padding:20px 20px 32px;}
  .hero{text-align:center;padding:38px 16px 30px;}
  .hero h1{font-size:29px;margin:0 0 8px;letter-spacing:-0.5px;font-weight:700;}
  .hero p{color:var(--sub);font-size:15px;margin:0;}
  .tabs{display:flex;gap:8px;justify-content:center;margin:20px 0 28px;}
  .tab-btn{padding:10px 20px;border-radius:999px;border:1px solid var(--line);background:var(--card);cursor:pointer;font-size:14px;font-weight:600;color:var(--sub);transition:all 0.15s ease;}
  .tab-btn:hover{border-color:var(--accent);color:var(--accent-dark);}
  .tab-btn.active{background:var(--accent);color:#fff;border-color:var(--accent);}
  .card{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);padding:20px;margin-bottom:16px;box-shadow:var(--shadow);transition:box-shadow 0.15s ease, transform 0.15s ease;}
  .card h3{margin:0 0 4px;font-size:17px;font-weight:700;}
  .meta{color:var(--sub);font-size:13px;margin:2px 0 10px;}
  .desc{font-size:14px;line-height:1.6;color:#3a3a37;white-space:pre-wrap;}
  .badge{display:inline-block;background:var(--accent-light);color:var(--accent-dark);font-size:12px;padding:3px 11px;border-radius:999px;margin-right:6px;margin-top:8px;font-weight:600;}
  .empty-badge{display:inline-block;background:var(--accent-light);color:var(--accent-dark);font-size:12px;padding:3px 12px;border-radius:999px;font-weight:800;letter-spacing:0.03em;}
  form.card{display:flex;flex-direction:column;gap:12px;max-width:460px;margin:0 auto 16px;}
  form.card.wide{max-width:none;}
  form.card.centered{text-align:center;}
  label{font-size:13px;font-weight:700;color:#4a4a46;display:block;text-align:left;}
  input,select,textarea{width:100%;padding:10px 12px;border:1px solid var(--line);border-radius:10px;font-size:14px;font-family:inherit;background:#fcfbf9;transition:border-color 0.15s ease, box-shadow 0.15s ease;}
  input:focus,select:focus,textarea:focus{outline:none;border-color:var(--accent);box-shadow:0 0 0 3px rgba(29,95,69,0.12);}
  input[readonly]{background:#f0efe9;color:var(--sub);cursor:not-allowed;}
  textarea{min-height:80px;resize:vertical;}
  .row2{display:grid;grid-template-columns:1fr 1fr;gap:12px;}
  .checkbox-row{display:flex;align-items:center;gap:8px;font-size:13px;color:#4a4a46;font-weight:400;text-align:left;}
  .pw-req{font-size:12px;color:var(--warn);margin-top:5px;}
  .pw-req.met{color:var(--accent);}
  .checkbox-row input{width:auto;}
  .submit-btn{background:linear-gradient(135deg, var(--accent), var(--accent-dark));color:#fff;border:none;padding:12px;border-radius:999px;font-size:15px;font-weight:700;cursor:pointer;margin-top:4px;transition:transform 0.12s ease, box-shadow 0.12s ease;box-shadow:0 3px 10px rgba(29,95,69,0.3);}
  .submit-btn:hover{transform:translateY(-1px);box-shadow:0 8px 20px rgba(29,95,69,0.38);}
  .submit-btn:active{transform:translateY(0) scale(0.98);}
  .submit-btn:disabled{opacity:0.6;cursor:default;transform:none;}
  .ghost-btn{background:transparent;border:1px solid var(--line);color:var(--ink);padding:8px 14px;border-radius:999px;font-size:13px;font-weight:700;cursor:pointer;transition:all 0.15s ease;}
  .ghost-btn:hover{background:var(--accent-light);border-color:var(--accent);}
  .empty{text-align:center;color:var(--accent-dark);padding:40px 20px;font-size:14.5px;font-weight:600;letter-spacing:0.01em;}
  .filter-bar{display:flex;gap:10px;margin-bottom:18px;flex-wrap:wrap;align-items:center;}
  .filter-bar select{flex:0 0 200px;}
  .filter-bar input{flex:0 0 200px;}
  .filter-bar .filter-btn{flex:0 0 auto;}
  .err{color:var(--warn);font-size:13px;margin-top:-4px;}
  .contact-reveal{font-size:13px;color:var(--ink);background:var(--accent-light);border-radius:10px;padding:8px 12px;margin-top:10px;display:inline-block;}
  .contact-btn{background:transparent;border:1px solid var(--accent);color:var(--accent);padding:7px 15px;border-radius:999px;font-size:13px;font-weight:700;cursor:pointer;margin-top:10px;margin-right:6px;transition:all 0.15s ease;}
  .contact-btn:hover{background:var(--accent-light);}
  .contact-btn:active{transform:scale(0.97);}
  .loading{text-align:center;color:var(--sub);padding:30px;font-size:14px;}
  .gate{text-align:center;padding:40px 20px;color:var(--sub);font-size:14px;}
  .trade-grid{display:grid;grid-template-columns:1fr 1fr;gap:8px;border:1px solid var(--line);border-radius:10px;padding:12px;background:#fcfbf9;text-align:left;}
  .trade-check{display:flex;align-items:center;gap:6px;font-size:13px;font-weight:400;color:var(--ink);}
  .trade-check input{width:auto;}
  .type-toggle{display:flex;gap:8px;margin-bottom:4px;}
  .type-toggle button{flex:1;padding:9px;border-radius:999px;border:1px solid var(--line);background:#fcfbf9;cursor:pointer;font-size:13px;font-weight:700;transition:all 0.15s ease;}
  .type-toggle button.active{background:var(--accent);color:#fff;border-color:var(--accent);}
  .photo-row{display:flex;gap:8px;flex-wrap:wrap;margin-top:10px;justify-content:center;}
  .photo-row img{width:88px;height:88px;object-fit:cover;border-radius:10px;border:1px solid var(--line);cursor:zoom-in;transition:transform 0.12s ease;}
  .photo-row img:hover{transform:scale(1.04);}
  .card-head{display:flex;align-items:center;gap:12px;margin-bottom:4px;}
  .avatar{width:44px;height:44px;border-radius:50%;object-fit:cover;background:var(--accent-light);flex-shrink:0;cursor:zoom-in;}
  .avatar-fallback{width:44px;height:44px;border-radius:50%;background:var(--accent-light);color:var(--accent-dark);display:flex;align-items:center;justify-content:center;font-weight:700;font-size:15px;flex-shrink:0;}
  .logo-img{width:44px;height:44px;border-radius:10px;object-fit:cover;border:1px solid var(--line);flex-shrink:0;cursor:zoom-in;}
  .stars{color:var(--star);font-size:14px;letter-spacing:1px;}
  .review{border-top:1px solid var(--line);padding-top:10px;margin-top:10px;}
  .review .rname{font-weight:700;font-size:13px;}
  .review .rcomment{font-size:13px;color:#3a3a37;margin-top:2px;}
  .file-hint{font-size:12px;color:var(--sub);margin-top:6px;}
  .thread-list-item{display:flex;align-items:center;gap:10px;padding:12px;border-bottom:1px solid var(--line);cursor:pointer;transition:background 0.12s ease;}
  .thread-list-item:hover{background:var(--accent-light);}
  .thread-list-item .tname{font-weight:700;font-size:14px;}
  .thread-list-item .tpreview{font-size:13px;color:var(--sub);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:340px;}
  .pin-btn{background:transparent;border:none;font-size:16px;cursor:pointer;padding:4px;color:var(--sub);flex-shrink:0;}
  .pin-btn.pinned{color:var(--star);}
  .msg-bubble{max-width:75%;padding:8px 14px;border-radius:16px;margin-bottom:8px;font-size:14px;line-height:1.4;}
  .msg-mine{background:var(--accent);color:#fff;margin-left:auto;border-bottom-right-radius:4px;}
  .msg-theirs{background:var(--accent-light);color:var(--ink);margin-right:auto;border-bottom-left-radius:4px;}
  .msg-thread{display:flex;flex-direction:column;max-height:420px;overflow-y:auto;padding:12px;background:#fcfbf9;border:1px solid var(--line);border-radius:12px;margin-bottom:10px;}
  .msg-send-row{display:flex;gap:8px;}
  .msg-send-row input{flex:1;}
  .msg-send-row button{width:auto;padding:10px 16px;}
  .status-pill{display:inline-block;font-size:12px;padding:3px 11px;border-radius:999px;margin-top:8px;margin-right:6px;font-weight:600;}
  .status-waiting{background:#fdf1de;color:#8a5a12;}
  .status-done{background:var(--accent-light);color:var(--accent-dark);}

  .file-input-hidden{position:absolute;width:1px;height:1px;overflow:hidden;opacity:0;}
  .file-btn{display:inline-flex;align-items:center;gap:6px;background:linear-gradient(135deg, var(--accent), var(--accent-dark));color:#fff;border:none;padding:10px 20px;border-radius:999px;font-size:13px;font-weight:700;cursor:pointer;transition:transform 0.1s ease, box-shadow 0.12s ease;box-shadow:0 2px 8px rgba(29,95,69,0.22);}
  .file-btn:hover{transform:translateY(-1px);box-shadow:0 6px 14px rgba(29,95,69,0.28);}
  .file-btn:active{transform:translateY(0) scale(0.97);}
  .file-btn.secondary{background:var(--accent-light);color:var(--accent-dark);box-shadow:none;}
  .file-btn.secondary:hover{background:#d3e6db;transform:none;}

  .avatar-crop-wrap{width:160px;height:160px;border-radius:50%;overflow:hidden;background:var(--accent-light);border:2px solid var(--line);position:relative;cursor:grab;flex-shrink:0;user-select:none;touch-action:none;margin:0 auto;}
  .logo-crop-wrap{border-radius:20px;}
  .avatar-crop-wrap:active{cursor:grabbing;}
  .avatar-crop-wrap img{position:absolute;left:0;top:0;max-width:none;pointer-events:none;}
  .avatar-crop-placeholder{width:100%;height:100%;display:flex;align-items:center;justify-content:center;color:var(--accent-dark);font-size:12px;text-align:center;padding:10px;}
  .avatar-preview-circle{width:96px;height:96px;border-radius:50%;overflow:hidden;background:var(--accent-light);border:2px solid var(--line);margin:0 auto 10px;display:flex;align-items:center;justify-content:center;}
  .avatar-preview-circle img{width:100%;height:100%;object-fit:cover;}
  .avatar-preview-circle .placeholder-text{font-size:11px;font-weight:800;color:var(--accent-dark);text-align:center;padding:6px;text-transform:uppercase;letter-spacing:0.06em;line-height:1.4;}

  .logo-preview-row{display:flex;flex-direction:column;align-items:center;gap:10px;margin-top:8px;}
  .logo-preview{width:88px;height:88px;border-radius:16px;object-fit:cover;border:1px solid var(--line);background:var(--accent-light);}

  .toast-wrap{position:fixed;top:20px;right:20px;z-index:9999;display:flex;flex-direction:column;gap:10px;max-width:320px;}
  .toast{background:linear-gradient(135deg, var(--accent), var(--accent-dark));color:#fff;padding:14px 36px 14px 18px;border-radius:16px;font-size:14px;line-height:1.4;box-shadow:0 8px 22px rgba(0,0,0,0.2);position:relative;animation:toast-in 0.18s ease;}
  .toast.toast-error{background:linear-gradient(135deg, #c8672a, var(--warn));}
  .toast .toast-close{position:absolute;top:6px;right:10px;background:transparent;border:none;color:#fff;font-size:18px;cursor:pointer;line-height:1;padding:2px;}
  @keyframes toast-in{from{opacity:0;transform:translateY(-8px);}to{opacity:1;transform:translateY(0);}}

  .confirm-overlay{position:fixed;inset:0;background:rgba(18,63,46,0.45);display:flex;align-items:center;justify-content:center;z-index:9999;padding:20px;}
  .confirm-box{background:#fff;border-radius:18px;padding:24px;max-width:360px;width:100%;text-align:center;box-shadow:0 16px 44px rgba(0,0,0,0.3);}
  .confirm-box p{margin:0 0 18px;font-size:14px;color:var(--ink);}
  .confirm-actions{display:flex;gap:10px;justify-content:center;margin-top:14px;}
  .confirm-actions button{padding:9px 20px;border-radius:999px;border:none;font-size:13px;font-weight:700;cursor:pointer;transition:transform 0.1s ease;}
  .confirm-actions button:active{transform:scale(0.97);}
  .confirm-yes{background:var(--accent);color:#fff;}
  .confirm-yes:hover{background:var(--accent-dark);}
  .confirm-no{background:var(--accent-light);color:var(--accent-dark);}
  .confirm-no:hover{background:#d3e6db;}

  .lightbox-overlay{position:fixed;inset:0;background:rgba(10,28,20,0.85);display:flex;align-items:center;justify-content:center;z-index:10000;padding:24px;cursor:zoom-out;}
  .lightbox-img-full{max-width:90vw;max-height:90vh;border-radius:14px;box-shadow:0 16px 48px rgba(0,0,0,0.4);}

  .business-hero{text-align:center;padding:10px 0 20px;}
  .business-logo-lg{width:140px;height:140px;border-radius:24px;object-fit:cover;border:1px solid var(--line);background:var(--accent-light);cursor:zoom-in;box-shadow:var(--shadow);}
  .business-logo-lg-fallback{width:140px;height:140px;border-radius:24px;background:var(--accent-light);color:var(--accent-dark);display:flex;align-items:center;justify-content:center;font-weight:700;font-size:40px;}

  .welcome-wrap{max-width:720px;margin:0 auto;position:relative;}
  .welcome-hero{text-align:center;padding:20px 16px 32px;position:relative;}
  .welcome-directory-fade-wrap{position:relative;max-height:1100px;overflow:hidden;margin-bottom:4px;}
  .welcome-directory-fade{position:absolute;left:0;right:0;bottom:0;height:200px;background:linear-gradient(to bottom, rgba(255,255,255,0) 0%, #ffffff 85%);pointer-events:none;}
  .welcome-hero h1{font-size:32px;margin:0 0 12px;letter-spacing:-0.6px;font-weight:700;}
  .welcome-hero p{color:var(--sub);font-size:16px;line-height:1.6;max-width:520px;margin:0 auto;}
  .welcome-cta{display:flex;flex-direction:column;align-items:center;gap:14px;margin:24px 0 0;}
  .welcome-cta .submit-btn{width:auto;padding:14px 36px;font-size:15.5px;}
  .welcome-cta-sub{text-align:center;color:var(--sub);font-size:15px;max-width:520px;margin:36px auto 18px;line-height:1.6;}
  .welcome-cta-sub strong{color:var(--accent-dark);}
  .welcome-cols{display:grid;grid-template-columns:1fr 1fr;gap:16px;margin-top:18px;}
  .welcome-col h3{margin:0 0 8px;font-size:16px;font-weight:700;}
  .welcome-col ul{margin:0;padding-left:18px;font-size:14px;color:#3a3a37;line-height:1.8;}
  @media (max-width:600px){ .welcome-cols{grid-template-columns:1fr;} }

  .thread-item{padding:16px 0;border-bottom:1px solid var(--line);}
  .thread-item:last-child{border-bottom:none;}
  .thread-item h4{margin:0 0 4px;font-size:15px;font-weight:700;cursor:pointer;}
  .thread-item h4:hover{color:var(--accent);}
  .reply-bubble{background:#fcfbf9;border:1px solid var(--line);border-radius:12px;padding:10px 14px;margin-top:10px;font-size:13px;}

  .dyn-list{display:flex;flex-direction:column;gap:8px;}
</style>
</head>
<body>

<header>
  <div class="brand" id="brand-logo">Trade<span>Linkd</span></div>
  <nav id="nav"></nav>
</header>

<main>
  <div id="content" class="loading">Loading...</div>
</main>

<footer>© 2026 TradeLinkd. All rights reserved.</footer>

<datalist id="city-list"></datalist>

<script>
const API = '';
const TRADES = ["Plumbing","Electrical","Roofing","HVAC","Painting","Landscaping","General Contracting","Flooring","Carpentry","Drywall","Masonry","Cleaning","Dumpster Rental","Moving","Property Restoration","Handyman","Demolition","Junk Removal","Pest Control","Locksmith","Pools"];
const CITIES = ["New York, NY","Los Angeles, CA","Chicago, IL","Houston, TX","Phoenix, AZ","Philadelphia, PA","San Antonio, TX","San Diego, CA","Dallas, TX","San Jose, CA","Austin, TX","Jacksonville, FL","Fort Worth, TX","Columbus, OH","Charlotte, NC","San Francisco, CA","Indianapolis, IN","Seattle, WA","Denver, CO","Washington, DC","Boston, MA","Detroit, MI","Nashville, TN","Portland, OR","Las Vegas, NV","Memphis, TN","Louisville, KY","Baltimore, MD","Milwaukee, WI","Atlanta, GA","Miami, FL","Minneapolis, MN","Tampa, FL","New Orleans, LA","Cleveland, OH","Pittsburgh, PA","Cincinnati, OH","Orlando, FL","Raleigh, NC","St. Louis, MO","Salt Lake City, UT","Grand Rapids, MI","Ann Arbor, MI","Warren, MI","Sterling Heights, MI","Livonia, MI","Dearborn, MI","Troy, MI","Farmington Hills, MI","Novi, MI","Southfield, MI","Rochester Hills, MI","Flint, MI","Lansing, MI","Kalamazoo, MI"];
const RADIUS_OPTIONS = [10, 25, 50, 100];

let state = {
  view: 'welcome', token: localStorageGet('hc_token'), user: null,
  authMode: 'login', signupType: 'homeowner',
  activeThreadUserId: null, editingJobId: null, businessId: null, currentBusiness: null,
  networkTab: 'members', activeNetworkPostId: null,
  pendingAvatarBlob: null,
  pendingLogoBlob: null
};

function localStorageGet(k){ try{ return localStorage.getItem(k); }catch(e){ return null; } }
function localStorageSet(k,v){ try{ localStorage.setItem(k,v); }catch(e){} }
function localStorageRemove(k){ try{ localStorage.removeItem(k); }catch(e){} }

async function api(path, opts={}){
  const headers = Object.assign({}, opts.headers || {});
  if(!(opts.body instanceof FormData)) headers['Content-Type'] = 'application/json';
  if(state.token) headers['Authorization'] = 'Bearer ' + state.token;
  const res = await fetch(API + path, Object.assign({}, opts, { headers }));
  let data = {};
  try{ data = await res.json(); }catch(e){}
  if(!res.ok){
    const err = new Error(data.error || 'Something went wrong. Please try again.');
    err.status = res.status;
    err.data = data;
    throw err;
  }
  return data;
}

function escapeHtml(s){ const d = document.createElement('div'); d.textContent = s || ''; return d.innerHTML; }
// Builds a display string from an entity's state + (optional, privacy-gated) county.
// The county field is only ever populated by the server when it's meant to be shown.
function locationLine(entity){
  if(!entity) return '';
  if(entity.county) return `${entity.county}, ${entity.state || ''}`;
  return entity.state || '';
}
function tradeOptions(){ return TRADES.map(t => `<option value="${t}">${t}</option>`).join(''); }
function stateOptions(selected){
  return `<option value="" disabled ${!selected?'selected':''}>Select your state</option>` +
    STATES.map(s=>`<option value="${s.code}" ${s.code===selected?'selected':''}>${s.name}</option>`).join('');
}
function stateCountyFields(prefix, stateVal, countyVal, countyPublicVal){
  return `<div style="text-align:left;">
    <label>State</label>
    <select id="${prefix}-state" required>${stateOptions(stateVal)}</select>
  </div>
  <div style="text-align:left;">
    <label>County (Optional)</label>
    <input type="text" id="${prefix}-county" placeholder="e.g. Macomb County" autocomplete="off" value="${escapeHtml(countyVal||'')}">
    <label class="checkbox-row" style="margin-top:8px;"><input type="checkbox" id="${prefix}-county-public" ${countyPublicVal?'checked':''}> Publicly display my county</label>
  </div>`;
}
function tradeCheckboxes(prefix, includeOther){
  let html = `<div class="trade-grid">${TRADES.map(t=>`
    <label class="trade-check"><input type="checkbox" class="${prefix}-trade" value="${t}"> ${t}</label>
  `).join('')}`;
  if(includeOther){
    html += `<label class="trade-check"><input type="checkbox" id="${prefix}-trade-other"> Other</label>`;
  }
  html += `</div>`;
  return html;
}
function radiusOptions(){ return RADIUS_OPTIONS.map(r=>`<option value="${r}">${r} Miles</option>`).join(''); }
function starDisplay(avg){
  if(avg == null) return '<span class="empty-badge">No Reviews Yet</span>';
  const full = Math.round(avg);
  return `<span class="stars">${'★'.repeat(full)}${'☆'.repeat(5-full)}</span> <span class="meta">${avg} avg</span>`;
}
function avatarHtml(pic, name, size){
  size = size || 44;
  if(pic) return `<img class="avatar zoomable" src="${escapeHtml(pic)}" style="width:${size}px;height:${size}px;">`;
  const initial = (name||'?').trim().charAt(0).toUpperCase();
  return `<div class="avatar-fallback" style="width:${size}px;height:${size}px;">${escapeHtml(initial)}</div>`;
}
function contactButtonHtml(contact){
  if(!contact) return `<button class="contact-btn" data-gate="1">View Contact Information</button>`;
  return `<button class="contact-btn" data-reveal-email="${escapeHtml(contact.email)}" data-reveal-phone="${contact.phone ? escapeHtml(contact.phone) : ''}">Show Contact Info</button>`;
}
function formatPhoneInput(raw){
  const digits = raw.replace(/\D/g, '').slice(0, 10);
  if(digits.length <= 3) return digits;
  if(digits.length <= 6) return `(${digits.slice(0,3)}) ${digits.slice(3)}`;
  return `(${digits.slice(0,3)}) ${digits.slice(3,6)}-${digits.slice(6)}`;
}
function formatBudgetInput(raw){
  // digits, spaces, hyphen (for ranges), $ and , and . only
  return raw.replace(/[^0-9\s\-\$,.]/g, '');
}

// ---------- Toasts ----------
function showToast(message, type){
  let wrap = document.getElementById('toast-wrap');
  if(!wrap){ wrap = document.createElement('div'); wrap.id = 'toast-wrap'; wrap.className = 'toast-wrap'; document.body.appendChild(wrap); }
  const t = document.createElement('div');
  t.className = 'toast' + (type === 'error' ? ' toast-error' : '');
  t.innerHTML = `${escapeHtml(message)}<button class="toast-close" aria-label="Close">&times;</button>`;
  t.querySelector('.toast-close').onclick = ()=> t.remove();
  wrap.appendChild(t);
}

// ---------- Custom confirm dialog ----------
function showConfirm(message){
  return new Promise((resolve)=>{
    const overlay = document.createElement('div');
    overlay.className = 'confirm-overlay';
    overlay.innerHTML = `<div class="confirm-box"><p>${escapeHtml(message)}</p>
      <div class="confirm-actions"><button class="confirm-no">Cancel</button><button class="confirm-yes">Yes, Continue</button></div></div>`;
    document.body.appendChild(overlay);
    overlay.querySelector('.confirm-no').onclick = ()=>{ overlay.remove(); resolve(false); };
    overlay.querySelector('.confirm-yes').onclick = ()=>{ overlay.remove(); resolve(true); };
  });
}

// ---------- Avatar cropper (used inside the profile picture popup) ----------
let activeDrag = null;
document.addEventListener('mousemove', (e)=>{ if(activeDrag) dragMove(e.clientX, e.clientY); });
document.addEventListener('mouseup', ()=>{ activeDrag = null; });
document.addEventListener('touchmove', (e)=>{ if(activeDrag){ const t = e.touches[0]; dragMove(t.clientX, t.clientY); e.preventDefault(); } }, { passive:false });
document.addEventListener('touchend', ()=>{ activeDrag = null; });

function dragMove(x, y){
  const { state: st, img, size } = activeDrag;
  let nx = activeDrag.startOffX + (x - activeDrag.startX);
  let ny = activeDrag.startOffY + (y - activeDrag.startY);
  const minX = size - st.dispW, maxX = 0, minY = size - st.dispH, maxY = 0;
  nx = Math.min(maxX, Math.max(minX, nx));
  ny = Math.min(maxY, Math.max(minY, ny));
  st.offsetX = nx; st.offsetY = ny;
  img.style.left = nx + 'px'; img.style.top = ny + 'px';
}

window.__cropStates = {};

function placeCropperImage(prefix, wrap, img, size){
  const SIZE = size || 160;
  const scale = Math.max(SIZE / img.naturalWidth, SIZE / img.naturalHeight);
  const dispW = img.naturalWidth * scale, dispH = img.naturalHeight * scale;
  const cs = { img, dispW, dispH, offsetX: (SIZE - dispW) / 2, offsetY: (SIZE - dispH) / 2, size: SIZE };
  window.__cropStates[prefix] = cs;
  wrap.innerHTML = '';
  img.style.width = dispW + 'px';
  img.style.height = dispH + 'px';
  img.style.left = cs.offsetX + 'px';
  img.style.top = cs.offsetY + 'px';
  wrap.appendChild(img);
  wrap.onmousedown = (e)=>{ activeDrag = { state: cs, img, size: SIZE, startX: e.clientX, startY: e.clientY, startOffX: cs.offsetX, startOffY: cs.offsetY }; e.preventDefault(); };
  wrap.ontouchstart = (e)=>{ const t = e.touches[0]; activeDrag = { state: cs, img, size: SIZE, startX: t.clientX, startY: t.clientY, startOffX: cs.offsetX, startOffY: cs.offsetY }; };
}

function cropToBlob(prefix, outputSize){
  outputSize = outputSize || 320;
  const cs = window.__cropStates[prefix];
  if(!cs) return Promise.resolve(null);
  const canvas = document.createElement('canvas');
  canvas.width = outputSize; canvas.height = outputSize;
  const ctx = canvas.getContext('2d');
  const factor = outputSize / cs.size;
  ctx.drawImage(cs.img, cs.offsetX * factor, cs.offsetY * factor, cs.dispW * factor, cs.dispH * factor);
  return new Promise(resolve => canvas.toBlob(b => resolve(b), 'image/jpeg', 0.92));
}

// Opens a popup where the user picks a photo and drags it to position within
// a circle. Calling onConfirm(blob) when they click "Use This Photo".
function openImageCropModal(title, shapeClass, onConfirm){
  const overlay = document.createElement('div');
  overlay.className = 'confirm-overlay';
  overlay.innerHTML = `<div class="confirm-box" style="max-width:360px;">
    <h3 style="margin-top:0;">${escapeHtml(title)}</h3>
    <div class="avatar-crop-wrap ${shapeClass}" id="modal-pic-wrap"><div class="avatar-crop-placeholder">Choose a photo below, then drag it to position</div></div>
    <div style="margin-top:14px;">
      <input type="file" id="modal-pic-input" accept="image/*" class="file-input-hidden">
      <label for="modal-pic-input" class="file-btn" id="modal-pic-label">Choose Photo</label>
    </div>
    <div class="confirm-actions">
      <button class="confirm-no" id="modal-pic-cancel">Cancel</button>
      <button class="confirm-yes" id="modal-pic-save">Use This Photo</button>
    </div>
  </div>`;
  document.body.appendChild(overlay);
  const input = overlay.querySelector('#modal-pic-input');
  const wrap = overlay.querySelector('#modal-pic-wrap');
  const label = overlay.querySelector('#modal-pic-label');
  input.onchange = ()=>{
    const file = input.files[0];
    if(!file) return;
    const img = new Image();
    img.onload = ()=> placeCropperImage('modal', wrap, img, 160);
    img.src = URL.createObjectURL(file);
    label.textContent = 'Change Photo';
  };
  overlay.querySelector('#modal-pic-cancel').onclick = ()=>{ delete window.__cropStates['modal']; overlay.remove(); };
  overlay.querySelector('#modal-pic-save').onclick = async ()=>{
    if(!window.__cropStates['modal']){ showToast('Please choose a photo first.', 'error'); return; }
    const blob = await cropToBlob('modal');
    delete window.__cropStates['modal'];
    overlay.remove();
    onConfirm(blob);
  };
}
function openProfilePicModal(onConfirm){
  openImageCropModal('Adjust Your Profile Picture', '', onConfirm);
}
function openLogoCropModal(onConfirm){

// ---------- Dynamic "keep adding a box as you fill one in" text lists ----------
function setupDynamicTextList(container, inputClass, placeholder){
  function addBox(){
    const input = document.createElement('input');
    input.type = 'text';
    input.className = inputClass;
    input.placeholder = placeholder;
    input.addEventListener('input', ()=>{
      const boxes = container.querySelectorAll('input');
      if(input === boxes[boxes.length - 1] && input.value.trim()){
        addBox();
      }
    });
    container.appendChild(input);
  }
  container.innerHTML = '';
  addBox();
}
function collectDynamicValues(container){
  return Array.from(container.querySelectorAll('input')).map(i => i.value.trim()).filter(Boolean);
}

function setView(v){ state.view = v; render(); }

async function render(){
  renderNav();
  const el = document.getElementById('content');
  el.innerHTML = '<div class="loading">Loading...</div>';
  try{
    if(!state.user && !['welcome','welcome-intro','account','jobs','contractors'].includes(state.view)){
      state.view = 'welcome';
    }
    if(state.user && state.user.type === 'contractor'){
      if(state.view === 'post') state.view = 'jobs';
      if(state.view === 'contractors') state.view = 'network';
      if(state.view === 'profile'){ state.view = 'business'; state.businessId = state.user.id; }
    }
    if(state.user && state.user.type === 'homeowner'){
      if(state.view === 'network') state.view = 'contractors';
    }
    if(state.view === 'welcome') el.innerHTML = await renderWelcome();
    else if(state.view === 'welcome-intro') el.innerHTML = renderWelcomeIntro();
    else if(state.view === 'jobs') el.innerHTML = await renderJobsList();
    else if(state.view === 'contractors') el.innerHTML = await renderContractorsList();
    else if(state.view === 'network') el.innerHTML = state.user ? await renderNetwork() : renderGate('use the contractor network');
    else if(state.view === 'business') el.innerHTML = await renderBusiness();
    else if(state.view === 'account') el.innerHTML = renderAccountForms();
    else if(state.view === 'post') el.innerHTML = state.user ? renderPostForm() : renderGate('post a job');
    else if(state.view === 'profile') el.innerHTML = state.user ? await renderProfile() : renderGate('view your profile');
    else if(state.view === 'messages') el.innerHTML = state.user ? await renderThreads() : renderGate('use messaging');
    else if(state.view === 'thread') el.innerHTML = state.user ? await renderThread() : renderGate('use messaging');
  }catch(e){
    el.innerHTML = `<div class="empty">We couldn't load this page: ${escapeHtml(e.message)}</div>`;
  }
  attachHandlers();
}

function jobCardHtml(j){
  const isMine = state.user && state.user.id === j.postedById;
  const isContractorViewer = state.user && state.user.type === 'contractor';
  return `<div class="card">
    <div class="card-head">${avatarHtml(j.postedByPic, j.postedBy)}<div><h3 style="margin:0;">${escapeHtml(j.title)}</h3>
    <div class="meta">${escapeHtml(j.location)} &middot; posted by ${escapeHtml(j.postedBy)}</div></div></div>
    <div class="desc">${escapeHtml(j.description)}</div>
    ${(j.trades||[]).map(t=>`<span class="badge">${escapeHtml(t)}</span>`).join('')}
    ${j.budget ? `<span class="badge">Budget: ${escapeHtml(j.budget)}</span>` : ''}
    ${j.photos.length ? `<div class="photo-row">${j.photos.map(p=>`<img class="zoomable" src="${escapeHtml(p)}">`).join('')}</div>` : ''}
    ${j.contractorId ? `<div>
      <span class="status-pill ${j.homeownerDone && j.contractorDone ? 'status-done':'status-waiting'}">Homeowner: ${j.homeownerDone?'Confirmed Done':'In Progress'}</span>
      <span class="status-pill ${j.contractorDone ? 'status-done':'status-waiting'}">${escapeHtml(j.contractorName)}: ${j.contractorDone?'Confirmed Done':'In Progress'}</span>
    </div>` : ''}
    <div style="margin-top:8px;">
      ${isContractorViewer ? `<button class="contact-btn" data-message-user="${j.postedById}" data-job="${j.id}">Send Message</button>` : ''}
      ${isMine ? `<button class="contact-btn" data-edit-job="${j.id}">Edit</button>
                  <button class="contact-btn" data-delete-job="${j.id}">Delete</button>` : ''}
      ${isMine && j.contractorId && !j.homeownerDone ? `<button class="contact-btn" data-complete-job="${j.id}">Mark Job Complete</button>` : ''}
      ${state.user && state.user.id === j.contractorId && !j.contractorDone ? `<button class="contact-btn" data-complete-job="${j.id}">Mark Job Complete</button>` : ''}
    </div>
  </div>`;
}

// ---------- Jobs ----------
async function renderJobsList(){
  const isContractorView = state.user && state.user.type === 'contractor';
  let html = `<div class="hero"><h1>${isContractorView ? 'Find Work' : 'Browse Jobs'}</h1><p>${isContractorView ? 'Jobs posted by homeowners looking for help.' : 'See what people need done.'}</p></div>`;

  const filter = window.__jobFilter || '';
  const fromState = window['__job-nearFromState'] || '';
  const fromCounty = window['__job-nearFromCounty'] || '';
  const radius = window['__job-nearRadius'] || '';
  const params = new URLSearchParams();
  if(filter) params.set('trade', filter);
  if(isContractorView && fromState && radius){ params.set('fromState', fromState); if(fromCounty) params.set('fromCounty', fromCounty); params.set('radiusMiles', radius); }
  const qs = params.toString() ? '?' + params.toString() : '';

  let jobsData;
  try{
    jobsData = await api('/api/jobs' + qs);
  }catch(e){
    throw e;
  }

  html += `<div class="filter-bar"><select id="job-filter" ${!state.user?'data-gate-select="1"':''}><option value="">All Trades</option>${tradeOptions()}</select></div>`;
  if(isContractorView) html += nearMeFilterBar('job-near');

  const { jobs } = jobsData;
  if(jobs.length===0){
    html += `<div class="empty">No jobs match your search right now.</div>`;
  } else {
    jobs.forEach(j=>{ html += jobCardHtml(j); });
  }
  return html;
}

async function renderNetworkMembers(){
  let html = `<div class="filter-bar"><select id="network-filter"><option value="">All Trades</option>${tradeOptions()}</select></div>`;
  html += nearMeFilterBar('network-near');
  html += `<div class="meta" style="margin-bottom:14px;">A space for contractor accounts to find and connect with each other — not visible to homeowners.</div>`;

  const filter = window.__networkFilter || '';
  const fromState = window['__network-nearFromState'] || '';
  const fromCounty = window['__network-nearFromCounty'] || '';
  const radius = window['__network-nearRadius'] || '';
  const params = new URLSearchParams();
  if(filter) params.set('trade', filter);
  if(fromState && radius){ params.set('fromState', fromState); if(fromCounty) params.set('fromCounty', fromCounty); params.set('radiusMiles', radius); }
  const qs = params.toString() ? '?' + params.toString() : '';
  const { contractors } = await api('/api/contractors/network' + qs);

  <div id="msg-err" class="err" style="display:none;"></div>
  </div>`;
  return html;
}

        showToast('Bio saved.');
        render();
      }catch(err){ errEl.textContent = err.message; errEl.style.display='block'; }
    };
  }
  const bizLogoOpenModal = document.getElementById('biz-logo-open-modal');
  if(bizLogoOpenModal){
    bizLogoOpenModal.onclick = ()=>{
      openLogoCropModal(async (blob)=>{
        const errEl = document.getElementById('biz-logo-err');
        const fd = new FormData(); fd.append('logo', blob, 'logo.jpg');
        try{
          const r = await api('/api/auth/me/logo', { method:'POST', body: fd });
          state.user.logo = r.logo; state.user.profilePic = r.logo;
          errEl.style.display = 'none';
          showToast('Logo updated.');
          render();
        }catch(err){ errEl.textContent = err.message; errEl.style.display='block'; }
      });
    };
  }
  const bizPhotos = document.getElementById('biz-photos');
  if(bizPhotos){
    bizPhotos.onchange = async ()=>{
      const files = bizPhotos.files; if(!files.length) return;
      const errEl = document.getElementById('biz-photos-err');
      const fd = new FormData();
      Array.from(files).forEach(f => fd.append('photos', f));
      try{
        await api('/api/contractors/me/photos', { method:'POST', body: fd });
        errEl.style.display = 'none';
        showToast('Photos added to your work highlights.');
        render();
      }catch(err){ errEl.textContent = err.message; errEl.style.display='block'; }
    };
  }
}

async function loadJobIntoEditForm(jobId){
  try{
    const { jobs } = await api('/api/jobs');
    const job = jobs.find(j => String(j.id) === String(jobId));
    if(!job) return;
    setView('post');
    setTimeout(()=>{
      document.getElementById('jf-title').value = job.title;
      document.getElementById('jf-desc').value = job.description;
      document.getElementById('jf-budget').value = job.budget;
      (job.trades || []).forEach(t=>{
        const box = document.querySelector(`.jf-trade[value="${CSS.escape(t)}"]`);
        if(box) box.checked = true;
      });
    }, 0);
  }catch(e){}
}

(async function init(){
  await restoreSession();
  if(state.user){ state.view = state.user.type === 'homeowner' ? 'profile' : 'jobs'; }

  const params = new URLSearchParams(window.location.search);

  const resetToken = params.get('resetToken');
  if(resetToken){
    history.replaceState(null, '', window.location.pathname);
    state.resetToken = resetToken;
    state.authMode = 'reset';
    state.view = 'account';
  }

  render();
})();
</script>
